<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#091533">
  <meta name="description" content="Nathanial Henniges' personal website has moved to mrdemonwolf.com.">
  <meta http-equiv="refresh" content="5;url=https://mrdemonwolf.com/">
  <title>Moving to MrDemonWolf.com</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f4f8ff;
      background: radial-gradient(ellipse at 50% 35%, #142d5a 0, #091533 56%, #060d20 100%);
    }
    main { width: min(100%, 680px); }
    .card {
      padding: clamp(32px, 8vw, 64px);
      border: 1px solid #ffffff24;
      border-radius: 28px;
      background: #0d1c3bed;
      box-shadow: 0 28px 90px #0006;
      text-align: center;
    }
    .logo { display: block; width: min(100%, 280px); height: auto; margin: 0 auto 28px; }
    .eyebrow { margin: 0 0 16px; color: #7bdcff; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { max-width: 500px; margin: 0 auto 18px; font-size: clamp(34px, 7vw, 54px); line-height: 1.08; letter-spacing: -.045em; }
    .copy { margin: 0; color: #c0cbe0; font-size: clamp(16px, 2.5vw, 19px); line-height: 1.65; }
    .copy strong { color: #fff; font-weight: 650; }
    .button {
      min-height: 54px;
      margin: 32px auto 0;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-radius: 14px;
      color: #041326;
      background: #61d2ff;
      font-size: 15px;
      font-weight: 750;
      text-decoration: none;
      transition: background-color .18s ease, transform .18s ease;
    }
    .button:hover { transform: translateY(-2px); background: #8be0ff; }
    .button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .button svg { width: 17px; height: 17px; }
    .note { margin: 22px 0 0; color: #99a9c5; font-size: 13px; line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <img class="logo" src="/assets/logo-text-white.svg" alt="MrDemonWolf" width="2333" height="506">
      <p class="eyebrow">Nathanial Henniges · Personal site</p>
      <h1 id="page-title">My website has moved.</h1>
      <p class="copy">Find me at <strong>mrdemonwolf.com</strong>.</p>
      <a class="button" href="https://mrdemonwolf.com/">
        Visit mrdemonwolf.com
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <p class="note" role="status">Redirecting automatically in a few seconds.</p>
    </section>
  </main>
</body>
</html>
